name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    # Runner fixo: o PostgreSQL pré-instalado na imagem ubuntu-24.04 é o 16, a mesma versão
    # principal de produção. Antes era a imagem postgres:16 do ECR Public, que passou a falhar
    # no download ("Data limit exceeded", 25 e 26/10/2026) antes de qualquer teste.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: PostgreSQL 16 do runner (usuário rastro, banco rastro_teste)
        working-directory: /tmp
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -q; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER rastro WITH SUPERUSER PASSWORD 'rastro'" \
            -c "CREATE DATABASE rastro_teste OWNER rastro"
          versao=$(PGPASSWORD=rastro psql -h localhost -U rastro -d rastro_teste -Atc "SHOW server_version_num")
          echo "PostgreSQL do runner: $versao"
          if [ "${versao:0:2}" != "16" ]; then
            echo "::error::PostgreSQL do runner não é o 16 (server_version_num=$versao)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
